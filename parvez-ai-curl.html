<!DOCTYPE html>
<html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Parvez AI</title><style>
body{background:#0a1628;color:#fff;font-family:sans-serif;margin:0;display:flex;flex-direction:column;height:100vh}
#chat{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:80%;padding:10px 14px;border-radius:15px}.ai{background:#1e293b;align-self:flex-start}.user{background:#2563eb;align-self:flex-end}
#bar{display:flex;padding:10px;background:#020617}#inp{flex:1;padding:12px;border-radius:10px;border:none;outline:none}
#send{background:#f59e0b;border:none;padding:0 20px;border-radius:10px;font-weight:bold;margin-left:8px}
</style></head><body>
<div id="chat"><div class="msg ai">Salam! Ami Parvez AI. Tomar hukum er opekkhay achi.</div></div>
<div id="bar"><input id="inp" placeholder="Likho ekhane..."><button id="send">Send</button></div>
<script>
const API_KEY = "TOMAR_KEY_EKHANE";
const chat=document.getElementById('chat'),inp=document.getElementById('inp');
async function send(){const t=inp.value.trim();if(!t)return;chat.innerHTML+=`<div class=\"msg user\">${t}</div>`;inp.value='';
const d=document.createElement('div');d.className='msg ai';d.textContent='Likchi...';chat.appendChild(d);
const url=`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;
try{const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:t}]}]})});
const j=await r.json();d.textContent=j.candidates?.[0]?.content?.parts?.[0]?.text||'Dukkhito, uttor pelam na.';}catch(e){d.textContent='Error:'+e.message;}}
document.getElementById('send').onclick=send;inp.onkeydown=e=>{if(e.key==='Enter')send()};
</script></body></html>
